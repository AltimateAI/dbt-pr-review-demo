name: Altimate dbt PR Review

on:
  pull_request:
    paths:
      - "models/**"
      - "macros/**"
      - "snapshots/**"
      - "seeds/**"
      - "dbt_project.yml"
      - "packages.yml"
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dbt-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-duckdb>=1.8,<2.0"

      - name: Build base artifacts
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          git checkout --detach "${{ github.event.pull_request.base.sha }}"
          dbt seed --target-path target-base
          dbt compile --target-path target-base
          dbt docs generate --target-path target-base
          git checkout --detach "$HEAD_SHA"

      - name: Build head artifacts
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: |
          dbt seed
          dbt compile
          dbt docs generate

      # The current altimate-code release contains broken VS Code image
      # symlinks, which prevents GitHub from downloading the repository as a
      # composite action. Install the same release directly until the next
      # release fixes the action archive.
      - name: Install Altimate
        run: curl -fsSL https://www.altimate.sh/install | bash -s -- --version 0.8.3

      - name: Review dbt changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          "$HOME/.altimate/bin/altimate" review \
            --mode comment \
            --manifest target/manifest.json \
            --severity suggestion \
            --post
